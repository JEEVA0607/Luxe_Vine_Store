<!DOCTYPE html>
<html>

<head>
    <title>Track Order</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2>Your Order Status</h2>

<h1 id="token"></h1>

<div id="items"></div>

<!-- Timeline START -->
<div id="timeline">

    <div class="step" id="step-pending">
        🟡 Pending
    </div>

    <div class="step" id="step-accepted">
        🔵 Accepted
    </div>

    <div class="step" id="step-preparing">
        👨‍🍳 Preparing
    </div>

    <div class="step" id="step-ready">
        🍽 Ready
    </div>

    <div class="step" id="step-completed">
        ✅ Completed
    </div>

</div>
<!-- Timeline END -->

<h2 id="status">Loading...</h2>

<h3 id="total"></h3>

<button onclick="window.location.href='index.html'">
Back To Menu
</button>

<script type="module" src="js/order-status.js"></script>

</body>

</html>
