<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Account</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
.user-page{max-width:850px;margin:20px auto;padding:0 15px}.user-card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.user-card h2{margin-bottom:14px}.saved-address-card{border:1px solid #eee;border-radius:14px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.address-map{height:330px;border-radius:12px;overflow:hidden;margin-top:12px}.address-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.address-form input{padding:12px;border:1px solid #ddd;border-radius:10px}.address-form .full{grid-column:1/-1}.user-primary-btn{border:0;background:#ff6f00;color:#fff;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}.user-secondary-btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:11px 15px;cursor:pointer}@media(max-width:600px){.address-form{grid-template-columns:1fr}.saved-address-card{flex-direction:column;align-items:stretch}}
</style></head><body>
<header class="header"><div class="logo-area"><h1>👤 My Account</h1></div><div class="header-buttons"><button onclick="location.href='cart.html'">🛒 Cart</button></div></header>
<main class="user-page">
<section class="user-card"><h2>My Details</h2><p id="userDetails">Loading...</p></section>
<section class="user-card"><h2>📍 Saved Addresses</h2><div id="savedAddresses">Loading...</div></section>
<section class="user-card"><h2>➕ Add Delivery Address</h2><div class="address-form"><input id="addressName" placeholder="Name"><input id="addressPhone" placeholder="Phone Number"><input id="addressPlace" placeholder="Place Name"><input id="addressLandmark" placeholder="Near Landmark"><input class="full" id="addressLabel" placeholder="Address label (Home, Office, etc.)"><button class="user-secondary-btn full" id="useCurrentLocation">📍 Use My Current Location</button><button class="user-secondary-btn full" id="openAddressMap">🗺️ Select Location on Map</button></div><div id="addressMapBox" style="display:none">
<div style="display:flex;gap:8px;margin-top:12px"><input id="addressMapSearch" style="flex:1;padding:11px;border:1px solid #ddd;border-radius:10px" placeholder="🔍 Search place, area or landmark..."><button class="user-secondary-btn" id="addressMapSearchBtn">Search</button></div>
<div id="addressMapResults" style="background:#fff;border:1px solid #ddd;border-radius:10px;margin-top:6px;max-height:180px;overflow:auto;display:none"></div>
<div id="addressMap" class="address-map"></div></div><p id="addressLocationStatus" style="font-size:13px;color:#777;margin:10px 0">Location not selected</p><button class="user-primary-btn" id="saveAddress">Save Address</button></section>
</main>
<script src="js/bottom-nav.js"></script><script type="module" src="js/user.js"></script></body></html>
